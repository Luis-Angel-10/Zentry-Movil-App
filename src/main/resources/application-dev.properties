# ======================================================================
# Perfil "dev" — desarrollo local. Activo por defecto (ver application.properties).
#   ./mvnw spring-boot:run
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Si defines DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET como variables de
# entorno (o en un .env), esos valores tienen prioridad sobre los defaults de abajo.
# ======================================================================

# --- BASE DE DATOS (PostgreSQL local por defecto) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zentry_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Crea los 5 esquemas si no existen (PostgreSQL).
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS zentry_core; CREATE SCHEMA IF NOT EXISTS zentry_business; CREATE SCHEMA IF NOT EXISTS zentry_ai; CREATE SCHEMA IF NOT EXISTS zentry_analytics; CREATE SCHEMA IF NOT EXISTS zentry_realtime;

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT (secreto de desarrollo, NO usar en producción) ---
# Base64 de una cadena de 49 bytes -> válido para HS256. Se puede sobreescribir con JWT_SECRET.
security.jwt.secret-key=${JWT_SECRET:ZGV2LW9ubHktbm90LXNlY3VyZS1jaGFuZ2UtbWUtZGV2LW9ubHktbm90LXNlY3VyZQ==}

# --- MAIL (SMTP) — envío real del OTP de verificación ---
# Sin valores por defecto para host/puerto/usuario/password: si no configuras estas
# variables (en tu .env o como variables de entorno) el backend en dev NO arrancará
# ("Could not resolve placeholder"). Es intencional: preferimos fallar rápido en vez
# de intentar enviar correos con un SMTP de ejemplo inválido.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}
