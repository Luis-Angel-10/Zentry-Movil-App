spring.application.name=api

# Perfil activo por defecto: "dev". En producción arrancar con SPRING_PROFILES_ACTIVE=prod.
# Los tests fijan su propio perfil con @ActiveProfiles("test").
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Carga variables desde .env en la raíz del proyecto (si existe). No falla si no está presente.
spring.config.import=optional:file:.env[.properties]

# --- SWAGGER / OPENAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- PROXY / DEV TUNNELS ---
server.forward-headers-strategy=framework

# --- SEGURIDAD / JWT ---
# El secreto NUNCA lleva valor aquí. Cada perfil lo aporta:
#   - dev  : default local (solo para desarrollo, NO seguro)
#   - prod : exclusivamente por variable de entorno JWT_SECRET
#   - test : valor ficticio en src/test/resources/application-test.properties
# Debe ser una cadena Base64 válida y suficientemente larga para HS256 (>= 256 bits).
security.jwt.secret-key=${JWT_SECRET}
# Expiración del token en milisegundos (86400000 ms = 1 día).
security.jwt.expiration-time=${JWT_EXPIRATION_MS:86400000}

# --- SUBIDA DE ARCHIVOS ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

#Google
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true