# ======================================================================
# Perfil "prod" — producción. Activar con:  SPRING_PROFILES_ACTIVE=prod
#
# NINGÚN valor por defecto: si falta una variable de entorno la aplicación
# NO arranca (comportamiento deseado). Ningún secreto vive en el repositorio.
#
# Variables OBLIGATORIAS en el entorno:
#   DB_URL          (p. ej. jdbc:postgresql://<host>/<db>?sslmode=require)
#   DB_USERNAME
#   DB_PASSWORD
#   JWT_SECRET      (Base64 válido, >= 256 bits, generado de forma segura)
# Opcional:
#   JWT_EXPIRATION_MS  (por defecto 86400000)
# ======================================================================

# --- BASE DE DATOS ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Crea los 5 esquemas si no existen (PostgreSQL).
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS zentry_core; CREATE SCHEMA IF NOT EXISTS zentry_business; CREATE SCHEMA IF NOT EXISTS zentry_ai; CREATE SCHEMA IF NOT EXISTS zentry_analytics; CREATE SCHEMA IF NOT EXISTS zentry_realtime;

# "update" es no destructivo (solo añade columnas/tablas, nunca elimina).
# Recomendación futura: pasar a "validate" + migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT ---
# security.jwt.secret-key se hereda de application.properties como ${JWT_SECRET} (sin default).

# --- MAIL (SMTP) ---
# Variables OBLIGATORIAS en producción: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD.
# Igual que con la base de datos, sin defaults: si faltan, la aplicación no arranca.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}
