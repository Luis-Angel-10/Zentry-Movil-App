# Perfil "test": BD en memoria H2 en modo de compatibilidad PostgreSQL.
# Solo lo usan los tests anotados con @ActiveProfiles("test") (p. ej. ApiApplicationTests).
# NO afecta a producción ni a `spring-boot:run`, que siguen usando PostgreSQL.

# Los 5 esquemas se crean en la propia URL (cláusula INIT de H2) antes de que
# Hibernate genere el DDL. El "\\;" del fichero llega a H2 como "\;" (separador
# de sentencias dentro de INIT).
# NON_KEYWORDS: columnas ("value", "year", "timestamp") que PostgreSQL admite sin
# comillas pero H2 trata como reservadas; se excluyen para que el DDL de test no falle.
spring.datasource.url=jdbc:h2:mem:zentrytest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,YEAR,TIMESTAMP;INIT=CREATE SCHEMA IF NOT EXISTS zentry_core\\;CREATE SCHEMA IF NOT EXISTS zentry_business\\;CREATE SCHEMA IF NOT EXISTS zentry_ai\\;CREATE SCHEMA IF NOT EXISTS zentry_analytics\\;CREATE SCHEMA IF NOT EXISTS zentry_realtime
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Neutraliza el connection-init-sql de producción (sintaxis pensada para PostgreSQL).
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Secreto JWT ficticio (Base64) solo para poder levantar el contexto en tests.
security.jwt.secret-key=dGVzdHNlY3JldC1jaGFuZ2UtbWUtdGVzdHNlY3JldC1jaGFuZ2UtbWU=
security.jwt.expiration-time=86400000

# Mail "dummy" solo para que exista un bean JavaMailSender y el contexto de Spring
# levante en tests (p. ej. ApiApplicationTests). JavaMailSenderImpl no conecta hasta
# que se llama a send(), y ningún test real envía correo: los tests de AuthController
# mockean JavaMailSender/EmailService. No es una credencial real.
spring.mail.host=localhost
spring.mail.port=25
